name: Application Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk carnet-de-gres.apk
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk --title "Carnet de grès pour Android" \
              --notes "Dernière version de l'application. Téléchargez carnet-de-gres.apk depuis le téléphone pour l'installer." --latest
          fi
          gh release upload apk carnet-de-gres.apk --clobber
          gh release edit apk --notes "Version 1.${{ github.run_number }}, compilée depuis ${GITHUB_SHA::7}. Téléchargez carnet-de-gres.apk depuis le téléphone pour l'installer."

      - name: Enregistrer le journal de compilation
        if: always()
        run: |
          [ -f build.log ] || echo "Pas de journal" > build.log
          echo "Résultat : ${{ job.status }} (run ${{ github.run_number }}, ${GITHUB_SHA::7})" > resultat.txt
          tail -c 200000 build.log > journal.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rfq --cached .
          git add resultat.txt journal.txt
          git commit -qm "Journal de compilation ${{ github.run_number }}"
          git push -f origin build-log
